[package]
name = "sonkore"
description = "Sonkore music player"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sonkore-ui = { path = "../ui" }
sonkore-engine = { path = "../engine" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "renderer-femtovg", "unstable-winit-030", "accessibility"] }
sonkore-core = { path = "../core" }
sonkore-platform = { path = "../platform" }
sonkore-eq = { path = "../eq" }
sonkore-dsp = { path = "../dsp" }
sonkore-dsd = { path = "../dsd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonkore-library = { path = "../library" }
ttf-parser = "0.25"
realfft = "3.5"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# The document portal's file dialogs, on D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Sound devices plugged in or out: a watch on /dev/snd (hotplug.rs).
notify = { version = "8", default-features = false }
# Files dropped on the window under Wayland, where winit has no drag and
# drop: a data device on the window's own connection (dropped.rs). The
# versions winit already uses.
wayland-client = "0.31"
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"] }

[target.'cfg(windows)'.dependencies]
# #[implement] (the endpoint volume's change callback) names it.
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
# Sonkore.exe's icon and version on Windows (sonkore.rc).
embed-resource = "3"
