[package]
name = "sonkore-library"
description = "Sonkore's music library: scanning, metadata, playlists"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sonkore-core = { path = "../core" }
# library.json / favorites.json / playlists.json and MusicBrainz answers are
# read with serde_json (exact doubles); they are written by json_out.rs, in the stored format.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Folder watching.
notify = { version = "8", default-features = false }
# Loudness: EBU R128 (the pure-Rust port of libebur128) over symphonia's decoding.
ebur128 = "0.1"
symphonia = { version = "0.5.5", default-features = false, features = ["all-codecs", "all-formats", "opt-simd"] }
# Covers: decoding, scaling, rounded corners.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# Online covers (MusicBrainz + Cover Art Archive), blocking, on worker threads.
sha1_smol = "1"
base64 = "0.22"
percent-encoding = "2"
# Collation: accents are told apart from base letters by decomposing them.
unicode-normalization = "0.1"

# HTTPS: rustls on Linux; on Windows the system's own TLS (SChannel) and its
# certificate store, which needs no C compiler to build.
[target.'cfg(not(windows))'.dependencies]
ureq = "3"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
