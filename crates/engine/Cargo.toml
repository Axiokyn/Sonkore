[package]
name = "sonkore-engine"
description = "Sonkore's audio engine: decoding, DSP, bit-perfect output"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sonkore-core = { path = "../core" }
symphonia = { version = "0.5.5", default-features = false, features = ["all-codecs", "all-formats", "opt-simd"] }
sonkore-hdcd = { path = "../hdcd" }
sonkore-dsd = { path = "../dsd" }
sonkore-dsp = { path = "../dsp" }
sonkore-eq = { path = "../eq" }
sonkore-soundtouch = { path = "../soundtouch" }
# Opus, APE, WavPack, TTA, TAK, Musepack, WMA, AC-3, DTS: FFmpeg, loaded at run time.
sonkore-ffmpeg = { path = "../ffmpeg" }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"
libc = "0.2"

# WASAPI (shared and exclusive).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia"] }

[dev-dependencies]
