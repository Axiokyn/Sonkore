# The tests' ALSA: nothing reaches a real card. "default" is silent, and a
# card's own endpoint (hw:CARD=DX1,DEV=0, the cards of tests/asound) is ALSA's
# null device too, which takes any format (DSD_U32_BE as well): Sonkore's
# direct output and DSD can be played to it (crates/app/src/tap.rs keeps time).
pcm.!default { type null }
pcm.null { type null }
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD { type string default 0 }
    @args.DEV { type integer default 0 }
    @args.SUBDEV { type integer default -1 }
    type null
}
ctl.!default { type hw card 0 }
