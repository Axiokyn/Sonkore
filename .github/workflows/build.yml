# Builds and tests Sonkore; a tag "v*" (or a commit marked [release])
# publishes the AppImage and the Windows package as a GitHub release.
#   linux    the workspace's tests, with the engine's test corpus (ffmpeg,
#            flac), which the Windows job reuses, and the library's (lame,
#            wavpack too)
#   appimage Sonkore-x86_64.AppImage built on AlmaLinux 9 (glibc 2.34): runs
#            on any distribution from 2021 on
#   appimage-distros  it, on six distributions: libraries, a screenshot,
#            started on X11
#   windows  the tests, a release build, offscreen screenshots, the app
#            started for real (and a second launch handing it a quick action,
#            the single instance), and Sonkore-windows-x64.zip
#   release  on a "v*" tag or a commit marked [release]: the files above on
#            the release page
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Tools and libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libfontconfig-dev ffmpeg flac lame wavpack libavformat-dev libavcodec-dev libavutil-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Dependencies (licenses, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Corpus
        run: |
          tests/make_corpus.sh "$PWD/target/test-corpus" > /dev/null
          crates/library/tests/make_library_corpus.sh "$PWD/target/library-corpus" > /dev/null
      - name: Tests
        # No sound reaches any device: ALSA's default is a null sink.
        run: |
          export ALSA_CONFIG_PATH="$PWD/tests/pipewire/alsa-null.conf" SONKORE_TEST_CORPUS="$PWD/target/test-corpus"
          export SONKORE_LIBRARY_CORPUS="$PWD/target/library-corpus"
          cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: test-corpus
          path: target/test-corpus
          if-no-files-found: error

  # The AppImage, built on AlmaLinux 9 (glibc 2.34): it runs
  # on any distribution from 2021 on, not only on ones as new as the
  # machine it was built on.
  appimage:
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - name: Build environment
        run: |
          dnf -y install gcc pkgconf-pkg-config alsa-lib-devel findutils diffutils
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: AppImage
        run: |
          # The type 2 runtime the squashfs is appended to (tools/mkappimage).
          curl -sSfL -o /tmp/runtime https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          packaging/appimage.sh /tmp/runtime
          ldd --version | head -1
          objdump -T target/release/sonkore | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/Sonkore-x86_64.AppImage*
          if-no-files-found: error

  # The AppImage on clean installs of other distributions, with only what any
  # desktop has (an X server, Mesa, fontconfig, ALSA's library): nothing it
  # loads may be missing, it draws a screenshot offscreen, and it starts and
  # keeps running on X11.
  appimage-distros:
    needs: appimage
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            setup: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q xvfb libgl1 libegl1 fontconfig fonts-dejavu-core libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libwayland-client0 libwayland-cursor0 libdbus-1-3 libasound2 binutils
          - image: ubuntu:24.04
            setup: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q xvfb libgl1 libegl1 fontconfig fonts-dejavu-core libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libwayland-client0 libwayland-cursor0 libdbus-1-3 libasound2t64 binutils
          - image: debian:12
            setup: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q xvfb libgl1 libegl1 fontconfig fonts-dejavu-core libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libwayland-client0 libwayland-cursor0 libdbus-1-3 libasound2 binutils
          - image: fedora:latest
            setup: dnf -y install xorg-x11-server-Xvfb mesa-libGL mesa-libEGL fontconfig dejavu-sans-fonts libxkbcommon libxkbcommon-x11 libX11 libX11-xcb libXcursor libXrandr libXi libwayland-client libwayland-cursor dbus-libs alsa-lib findutils binutils
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm xorg-server-xvfb mesa fontconfig ttf-dejavu libxkbcommon libxkbcommon-x11 libx11 libxcursor libxrandr libxi wayland dbus alsa-lib binutils
          - image: opensuse/tumbleweed
            setup: zypper -n install xorg-x11-server-Xvfb Mesa-libGL1 Mesa-libEGL1 fontconfig dejavu-fonts libxkbcommon0 libxkbcommon-x11-0 libX11-6 libX11-xcb1 libXcursor1 libXrandr2 libXi6 libwayland-client0 libwayland-cursor0 libdbus-1-3 libasound2 findutils binutils
    container: ${{ matrix.image }}
    steps:
      - name: Desktop basics
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - name: Libraries
        run: |
          chmod +x Sonkore-x86_64.AppImage
          ./Sonkore-x86_64.AppImage --appimage-extract > /dev/null
          ldd squashfs-root/usr/bin/sonkore
          ! ldd squashfs-root/usr/bin/sonkore | grep "not found"
      - name: Screenshot (offscreen)
        run: |
          export XDG_CONFIG_HOME=/tmp/p/config XDG_DATA_HOME=/tmp/p/data XDG_CACHE_HOME=/tmp/p/cache
          SONKORE_SCREENSHOT=/tmp/main.png timeout 60 squashfs-root/AppRun
          test -s /tmp/main.png
      - name: Starts and keeps running (X11)
        run: |
          export XDG_CONFIG_HOME=/tmp/p/config XDG_DATA_HOME=/tmp/p/data XDG_CACHE_HOME=/tmp/p/cache XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p -m 700 /tmp/xdg
          Xvfb :99 -screen 0 1600x1000x24 & export DISPLAY=:99; sleep 2
          timeout -s TERM 20 squashfs-root/AppRun > run.log 2>&1 || status=$?
          cat run.log
          # 124: still running after 20 s (stopped by timeout), as wanted.
          [ "${status:-0}" = 124 ] || [ "${status:-0}" = 0 ] || exit 1
          ! grep -iE "panicked|cannot open shared object|failed to (load|open)" run.log

  windows:
    needs: linux
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: test-corpus
          path: target/test-corpus
      - name: Tests
        run: |
          $env:SONKORE_TEST_CORPUS = "$PWD\target\test-corpus"
          cargo test --workspace
      - name: Output devices (WASAPI)
        # The runner may have no sound card: this only shows what is listed.
        run: cargo run --release -p sonkore-engine --example devices
        continue-on-error: true
      - name: Build
        run: cargo build --release -p sonkore
      - name: Screenshots (offscreen)
        # A profile of its own (SONKORE_APPDATA / SONKORE_LOCALAPPDATA), so
        # nothing of the runner's user is read.
        run: |
          $exe = "$PWD\target\release\sonkore.exe"
          $shots = New-Item -ItemType Directory -Force -Path "$PWD\target\shots"
          $env:SONKORE_APPDATA = "$PWD\target\profile\roaming"
          $env:SONKORE_LOCALAPPDATA = "$PWD\target\profile\local"
          foreach ($view in @(@{ name = "main"; window = "" }, @{ name = "settings"; window = "settings" }, @{ name = "equalizer"; window = "equalizer" })) {
            $env:SONKORE_SCREENSHOT = "$shots\$($view.name).png"
            $env:SONKORE_SCREENSHOT_WINDOW = $view.window
            $p = Start-Process -FilePath $exe -PassThru -NoNewWindow
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$($view.name): still running after 60 s" }
            if (-not (Test-Path "$shots\$($view.name).png")) { throw "$($view.name): no screenshot (exit $($p.ExitCode))" }
          }
          Get-ChildItem $shots
      - name: Starts, keeps running, single instance
        run: |
          $exe = "$PWD\target\release\sonkore.exe"
          $env:SONKORE_APPDATA = "$PWD\target\profile\roaming"
          $env:SONKORE_LOCALAPPDATA = "$PWD\target\profile\local"
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Sonkore quit by itself (exit $($app.ExitCode))" }
          if ($app.MainWindowHandle -eq 0) { $app.Refresh() }
          Write-Host "window: $($app.MainWindowTitle) handle $($app.MainWindowHandle)"
          # A second launch with a quick action hands it to the running one
          # (the named pipe) and ends; without the pipe it would stay open.
          $second = Start-Process -FilePath $exe -ArgumentList "--play-pause" -PassThru
          if (-not $second.WaitForExit(15000)) { $second.Kill(); $app.Kill(); throw "a second launch did not hand over to the running instance" }
          if ($app.HasExited) { throw "the running instance quit after the quick action" }
          $app.CloseMainWindow() | Out-Null
          if (-not $app.WaitForExit(10000)) { $app.Kill(); throw "Sonkore did not close from its window" }
      - name: Package
        run: |
          $stage = New-Item -ItemType Directory -Force -Path "$PWD\dist\Sonkore"
          Copy-Item "$PWD\target\release\sonkore.exe" "$stage\Sonkore.exe"
          Copy-Item "$PWD\LICENSE" "$stage\LICENSE.txt"
          Copy-Item "$PWD\THIRD-PARTY.md" "$stage\THIRD-PARTY.md"
          Copy-Item -Recurse "$PWD\licenses" "$stage\licenses"
          Compress-Archive -Path "$PWD\dist\Sonkore" -DestinationPath "$PWD\dist\Sonkore-windows-x64.zip" -Force
          $hash = (Get-FileHash "$PWD\dist\Sonkore-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "$PWD\dist\Sonkore-windows-x64.zip.sha256" -Value "$hash  Sonkore-windows-x64.zip`n"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/Sonkore-windows-x64.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: target/shots

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [linux, appimage, appimage-distros, windows]
    runs-on: ubuntu-24.04
    # Pushing one commit to two branches must not publish it twice at once.
    concurrency: release-${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml | head -1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # A published version is never replaced: if this version's tag already
      # names another commit, raise the version in Cargo.toml.
      - name: Refuse to overwrite a published version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # (No such tag yet: the API answers with an error, not a commit.)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null || true)
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG is already published from ${sha:0:7}; raise the version in Cargo.toml"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sonkore ${{ steps.version.outputs.version }}
          body: |
            Sonkore ${{ steps.version.outputs.tag }}

            - **Linux x86_64:** `Sonkore-x86_64.AppImage` — make it executable and run it; nothing else to install (glibc 2.34 or newer).
            - **Windows 64-bit:** `Sonkore-windows-x64.zip` — unzip and run `Sonkore.exe`.

            Each file has a `.sha256` next to it.
          files: |
            artifacts/appimage/*.AppImage
            artifacts/appimage/*.sha256
            artifacts/windows-x64/*.zip
            artifacts/windows-x64/*.sha256
